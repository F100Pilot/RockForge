services:
  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    ports: ["8000:8000"]
    environment: &env
      ROCKFORGE_DATABASE_URL: postgresql+psycopg://rockforge:rockforge@db:5432/rockforge
      ROCKFORGE_BROKER_URL: redis://redis:6379/0
      ROCKFORGE_RESULT_BACKEND: redis://redis:6379/1
      ROCKFORGE_WORK_DIR: /data
      # This is the ONE deployment path that opens a real network port — unlike
      # start.bat/the standalone .exe (both bind 127.0.0.1), the API here has no
      # auth unless this is set. Put a real secret in a .env file next to this
      # compose file (never commit it); compose fails to start without one
      # rather than silently running the API unauthenticated on the network.
      ROCKFORGE_API_TOKEN: ${ROCKFORGE_API_TOKEN:?set a secret in a .env file next to docker-compose.yml — see README}
      # Wwise local (nunca incluído na imagem — EULA Audiokinetic). Em Docker/Linux
      # exigiria Wine + instalação manual; para usar o teu Wwise, corre o worker
      # nativamente no Windows (ver README "Como testar").
      # ROCKFORGE_WWISE_ROOT: "C:/Program Files (x86)/Audiokinetic/Wwise2023..."
    volumes: ["workdata:/data"]
    depends_on: [db, redis]

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    environment: *env
    volumes: ["workdata:/data"]
    depends_on: [db, redis]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rockforge
      POSTGRES_PASSWORD: rockforge
      POSTGRES_DB: rockforge
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine

volumes:
  workdata:
  pgdata:
