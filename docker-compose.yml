services:
  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    ports: ["8000:8000"]
    environment: &env
      ROCKFORGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rockforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file next to docker-compose.yml — see docs/TECHNICAL.md}@db:5432/${POSTGRES_DB:-rockforge}
      ROCKFORGE_BROKER_URL: redis://redis:6379/0
      ROCKFORGE_RESULT_BACKEND: redis://redis:6379/1
      ROCKFORGE_WORK_DIR: /data
      # This is the ONE deployment path that opens a real network port — unlike
      # start.bat/the standalone .exe (both bind 127.0.0.1), the API here has no
      # auth unless this is set. Put a real secret in a .env file next to this
      # compose file (never commit it); compose fails to start without one
      # rather than silently running the API unauthenticated on the network.
      ROCKFORGE_API_TOKEN: ${ROCKFORGE_API_TOKEN:?set a secret in a .env file next to docker-compose.yml — see docs/TECHNICAL.md}
      # Reached by this machine's own name or address, so any Host is accepted;
      # the token above is what guards it (see app._verify_host).
      ROCKFORGE_ALLOWED_HOSTS: ${ROCKFORGE_ALLOWED_HOSTS:-*}
      # Wwise local (nunca incluído na imagem — EULA Audiokinetic). Em Docker/Linux
      # exigiria Wine + instalação manual; para usar o teu Wwise, corre o worker
      # nativamente no Windows (ver docs/TECNICO.md "Como testar").
      # ROCKFORGE_WWISE_ROOT: "C:/Program Files (x86)/Audiokinetic/Wwise2023..."
    volumes: ["workdata:/data"]
    depends_on: [db, redis]

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    environment: *env
    volumes: ["workdata:/data"]
    depends_on: [db, redis]

  db:
    image: postgres:16-alpine
    environment:
      # Credentials come from the same .env as ROCKFORGE_API_TOKEN — never
      # hardcoded. The password is required (no default), so `docker compose up`
      # refuses to start with a blank/known password rather than shipping the
      # old rockforge/rockforge default. Not network-reachable (no published
      # port), so this is defense-in-depth after another container compromise.
      POSTGRES_USER: ${POSTGRES_USER:-rockforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file next to docker-compose.yml — see docs/TECHNICAL.md}
      POSTGRES_DB: ${POSTGRES_DB:-rockforge}
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine

volumes:
  workdata:
  pgdata:
