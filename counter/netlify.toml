# RockForge's install counter — its own Netlify project ("rockforge-counter").
# Linked to this repo with base directory `counter`; only changes under
# counter/ trigger a deploy.
[build]
  publish = "public"
  command = "npm install --no-audit --no-fund"
  # Skip the build unless counter/ changed; always build the first deploy and
  # a manual retry (no previous commit, or the same one).
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

[functions]
  directory = "netlify/functions"
