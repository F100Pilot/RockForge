# RockForge's install counter — its own Netlify project ("rockforge-counter"),
# linked to this repo. Everything it deploys lives in counter/; the rest of the
# repo is not published. Paths below are relative to the base directory.
[build]
  base = "counter"
  publish = "public"
  command = "npm install --no-audit --no-fund"
  # Skip the build unless counter/ or this file changed; always build the first
  # deploy and a manual retry (no previous commit, or the same one). Runs in
  # the base directory.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../netlify.toml'

[functions]
  directory = "netlify/functions"
