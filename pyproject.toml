[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rockforge"
version = "0.1.0"
description = "Audio -> Rocksmith 2014 CDLC arrangement pipeline (research-grounded, honest about limits)"
readme = "README.md"
# <3.12: basic-pitch needs tensorflow<2.15.1, whose newest wheels target 3.11.
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "celery>=5.3",
    "redis>=4.5,<5",  # pinned <5: redis-py 5+ requires Redis 6+ (HELLO/RESP3); Windows often ships Redis 3.x
    "python-multipart>=0.0.9",
    "tinytag>=1.10",
    "pyguitarpro>=0.10",  # LGPL-3.0 (used as unmodified library) — GP3/GP4/GP5 only, no GPX
]

[project.optional-dependencies]
# Heavy ML stack — all permissive licences (MIT / Apache-2.0 / ISC).
# madmom (CC BY-NC-SA models) and Essentia (AGPL) are deliberately NOT included.
ml = [
    "demucs>=4.0",          # MIT — htdemucs_6s guitar stem (repo archived 2025-01; see docs/research)
    "basic-pitch>=0.3",     # Apache-2.0 — polyphonic note transcription
    # basic-pitch's default model is a TF SavedModel that often fails to load on
    # a mismatched TF version; the adapter prefers basic-pitch's bundled ONNX
    # copy, so ensure onnxruntime is present to load it.
    "onnxruntime>=1.16",
    "librosa>=0.10",        # ISC — beat tracking, tuning estimation
    "soundfile>=0.12",
    # Floor only: basic-pitch's "scipy>=1.4.1" lets the resolver settle on an
    # old scipy (e.g. 1.9.1) that has no Windows/cp311 wheel, forcing a source
    # build that needs a working MSVC ("Compiler cl can not compile programs").
    # scipy>=1.11 has cp311 wheels for win_amd64 and is still numpy<2 compatible.
    "scipy>=1.11",
    # tensorflow<2.15.1 needs numpy<2; basic-pitch's unconstrained
    # "scikit-learn" otherwise makes pip backtrack through many scikit-learn
    # versions (each pulling its own numpy/scipy range) to (re)discover this.
    # Spelling it out directly collapses most of that search.
    "numpy>=1.24,<2",
]
youtube = [
    "yt-dlp>=2024.4",       # Ingestão YouTube: viola o ToS do YouTube — desativada por defeito (ver config)
]
postgres = ["psycopg[binary]>=3.1"]
# Automatic lyric transcription (EXPERIMENTAL) — WhisperX over the Demucs
# vocals stem. Heavy (torch + model weights); the LRC path needs none of this.
# <3.4: whisperx>=3.4 pulls pyannote-audio>=4.0/numpy>=2.1, which conflicts with
# basic-pitch's tensorflow<2.15.1 (numpy<2) and makes pip's resolver explode
# (ResolutionTooDeep) when [ml] and [lyrics] are installed together.
lyrics = [
    "whisperx>=3.1,<3.4",
    # pyannote.audio==3.3.2 (pulled by whisperx) uses torchaudio.AudioMetaData
    # which was removed in torchaudio 2.5+. torch and torchaudio must match
    # exactly; pin both below 2.5 to keep the attribute accessible.
    "torch>=2.2,<2.5",
    "torchaudio>=2.2,<2.5",
]
# Native PSARC/SNG encryption (AES-256-CFB/CTR) — see infrastructure/packaging/psarc.
psarc = ["cryptography>=42", "Pillow>=10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.0.0",  # starlette>=1.3 TestClient requires httpx2; httpx is deprecated for testing
    "ruff>=0.4",
    "mypy~=1.19.0",  # pinned: CI must match local; mypy 2.x flagged extra issues (fixed) but drift breaks builds
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Wwise template projects (from DLC Builder, MIT) — required for Rocksmith-
# compatible .wem conversion (Vorbis with seek table).
"rockforge.infrastructure.packaging" = ["wwise_templates/*.zip", "wwise_templates/README.md"]
# Tone gear catalogue (from Rocksmith2014.NET, MIT) — the amp/cabinet/pedal
# database used to build in-game-valid tones for the .rs2dlc project.
"rockforge.infrastructure.packaging.gear" = ["tone_gear_data.json", "README.md"]
# Constant RSEnumerable flat models (song-independent) the game's xblock
# references; required for the native PSARC to enumerate the song.
"rockforge.infrastructure.packaging.psarc" = ["flatmodels/*.flat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's File()/Form() defaults are the framework's DI idiom
"src/rockforge/interfaces/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rockforge"]
ignore_missing_imports = true

# Boundary layers depend on framework decorators/metaclasses (FastAPI, Celery,
# SQLAlchemy, Pydantic) that mypy may resolve as Any depending on environment;
# strictness is relaxed only there. Domain/application/algorithms stay strict.
[[tool.mypy.overrides]]
module = [
    "rockforge.interfaces.*",
    "rockforge.infrastructure.db.*",
    "rockforge.config",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_untyped_calls = false

# The demucs monkeypatch needs type: ignore comments when demucs is installed
# (the ml extra), but CI runs without it, so demucs resolves to Any and the
# ignores look unused. Don't flag them either way.
[[tool.mypy.overrides]]
module = ["rockforge.infrastructure.separation._demucs_patcher"]
warn_unused_ignores = false
