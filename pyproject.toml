[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rockforge"
version = "0.10.0b5"
description = "Guitar Pro (or a tab PDF/picture, or a Songsterr link) + a recording -> Rocksmith 2014 CDLC: a playable PSARC and a DLC Builder project"
readme = "README.md"
# <3.12: the ml/lyrics stack (torch<2.5 / demucs / whisperx) targets 3.11 wheels.
# (The old, stricter reason — basic-pitch's tensorflow<2.15.1 — is gone; audio
# note transcription was removed, so this pin could potentially be relaxed after
# re-validating the full ml+lyrics install.)
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "celery>=5.3",
    "redis>=4.5,<5",  # pinned <5: redis-py 5+ requires Redis 6+ (HELLO/RESP3); Windows often ships Redis 3.x
    "python-multipart>=0.0.9",
    "tinytag>=1.10",
    "pyguitarpro>=0.10",  # LGPL-3.0 (used as unmodified library) — GP3/GP4/GP5 only, no GPX
    "certifi>=2024.2.2",  # current Mozilla roots for outbound HTTPS — see infrastructure/_https.py
    "requests>=2.28",  # Songsterr: the reference tool's client, default headers — see infrastructure/songsterr.py
]

[project.optional-dependencies]
# Heavy ML stack — all permissive licences (MIT / Apache-2.0 / ISC).
# madmom (CC BY-NC-SA models) and Essentia (AGPL) are deliberately NOT included.
ml = [
    "demucs>=4.0",          # MIT — htdemucs_6s guitar stem (repo archived 2025-01; see docs/research)
    "librosa>=0.10",        # ISC — tempo/onset/tuning for GP auto-sync
    "soundfile>=0.12",
    # scipy>=1.11 has cp311 wheels for win_amd64 (avoids a source build) and is
    # numpy<2 compatible.
    "scipy>=1.11",
    # numpy<2 kept as a conservative pin: the demucs/librosa/whisperx stack is
    # validated against numpy<2. Bump only after re-checking the full ml+lyrics
    # resolve (the old hard reason, basic-pitch's tensorflow, is gone).
    "numpy>=1.24,<2",
]
postgres = ["psycopg[binary]>=3.1"]
# Automatic lyric transcription (EXPERIMENTAL) — WhisperX over the Demucs
# vocals stem. Heavy (torch + model weights); the LRC path needs none of this.
# <3.4: whisperx>=3.4 pulls pyannote-audio>=4.0/numpy>=2.1, which conflicts with
# the [ml] stack's numpy<2 pin and makes pip's resolver explode (ResolutionTooDeep)
# when [ml] and [lyrics] are installed together.
lyrics = [
    "whisperx>=3.1,<3.4",
    # pyannote.audio==3.3.2 (pulled by whisperx) uses torchaudio.AudioMetaData
    # which was removed in torchaudio 2.5+. torch and torchaudio must match
    # exactly; pin both below 2.5 to keep the attribute accessible.
    "torch>=2.2,<2.5",
    "torchaudio>=2.2,<2.5",
]
# Native PSARC/SNG encryption (AES-256-CFB/CTR) — see infrastructure/packaging/psarc.
psarc = ["cryptography>=42", "Pillow>=10"]
# Native desktop window for the standalone build (start_standalone.py). pywebview
# wraps the platform's OWN webview — Edge WebView2 on Windows, which ships with
# the OS — so it costs a few MB instead of bundling a second browser. Optional:
# without it the launcher serves and opens the default browser, as before.
desktop = ["pywebview>=5.0"]
# The audio of the YouTube video whose Songsterr bar times are used
# (infrastructure/youtube_audio.py). Unpinned above on purpose: YouTube breaks
# old yt-dlp releases, and the fix is always "upgrade yt-dlp". [default] brings
# yt-dlp-ejs, the solver for YouTube's JavaScript challenge (it also needs a JS
# runtime — Deno — installed separately); the floor is what the reference tool
# (teaqu/guitar-pro-youtube-sync) requires.
youtube = ["yt-dlp[default]>=2026.8.19"]
# Tablature in a PDF or a picture -> GP5 in the New project wizard: the user's own
# PDF-to-GP5 converter (infrastructure/gpimport/pdf_import.py), with its OCR for
# pictures. Pinned to a commit of that repository — it stays where the converter is
# developed; to take its improvements, move the commit here (start.bat reinstalls
# when this file changes). Needs git on the machine that installs it.
pdf = [
    "pdf-to-gp5[ocr] @ git+https://github.com/F100Pilot/PDF-to-GP5@12e1f8ea261909dea29c0b977776620f690998f3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.0.0",  # starlette>=1.3 TestClient requires httpx2; httpx is deprecated for testing
    "ruff>=0.4",
    "mypy~=1.19.0",  # pinned: CI must match local; mypy 2.x flagged extra issues (fixed) but drift breaks builds
    "types-requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Wwise template projects (from DLC Builder, MIT) — required for Rocksmith-
# compatible .wem conversion (Vorbis with seek table).
"rockforge.infrastructure.packaging" = ["wwise_templates/*.zip", "wwise_templates/README.md"]
# Tone gear catalogue (from Rocksmith2014.NET, MIT) — the amp/cabinet/pedal
# database used to build in-game-valid tones for the .rs2dlc project.
"rockforge.infrastructure.packaging.gear" = ["tone_gear_data.json", "default_tones/*.json", "README.md"]
# Constant RSEnumerable flat models (song-independent) the game's xblock
# references; required for the native PSARC to enumerate the song.
"rockforge.infrastructure.packaging.psarc" = ["flatmodels/*.flat", "vocals_symbols.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's File()/Form() defaults are the framework's DI idiom
"src/rockforge/interfaces/api/app.py" = ["B008"]
"src/rockforge/interfaces/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rockforge"]
ignore_missing_imports = true

# Boundary layers depend on framework decorators/metaclasses (FastAPI, Celery,
# SQLAlchemy, Pydantic) that mypy may resolve as Any depending on environment;
# strictness is relaxed only there. Domain/application/algorithms stay strict.
[[tool.mypy.overrides]]
module = [
    "rockforge.interfaces.*",
    "rockforge.infrastructure.db.*",
    "rockforge.config",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_untyped_calls = false

# The demucs monkeypatch needs type: ignore comments when demucs is installed
# (the ml extra), but CI runs without it, so demucs resolves to Any and the
# ignores look unused. Don't flag them either way.
[[tool.mypy.overrides]]
module = ["rockforge.infrastructure.separation._demucs_patcher"]
warn_unused_ignores = false
