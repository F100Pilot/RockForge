name: Release

# Builds the Windows downloads — the installer and the portable zip — on a real
# Windows machine, starts the FROZEN app and makes one project with it, and
# only then attaches the files to the GitHub Release of the tag.
#
# A version bump publishes itself: when CI passes on main and installer.iss
# names a version that has no tag yet, this creates the tag (v<version>) and
# the release — a pre-release for a beta — with docs/RELEASE_NOTES.md as its
# text. Nothing has to be tagged by hand (the session that writes the code
# cannot push tags). A tag pushed by hand still works, and a manual run
# (Actions → Release → Run workflow) is a dry build whose files stay as its
# artifacts — or, given the tag of an existing release, attaches them to it.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    # "v0.10.0-beta.3" — or "0.10.0-beta.3": GitHub's release page does not add the v.
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the files to this existing release (its tag). Empty = a dry build."
        required: false
        default: ""

permissions:
  contents: read

# One release at a time: a second CI run on the same, still unreleased version
# waits here and then finds the tag already made.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
      create: ${{ steps.pick.outputs.create }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # tools/release_check checks that every fix said to be in the version
          # is an ancestor of it, which needs the history.
          fetch-depth: 0
      - name: Which release, if any
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CI_OK: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TAG_REF: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "workflow_run" ]; then
            # A pushed tag, or a manual run naming one, publishes too: same gate.
            if [ -n "$TAG_REF" ]; then
              python3 -m tools.release_check "${TAG_REF#v}"
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG_REF" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CI_OK" != "true" ]; then
            echo "CI did not pass on a push to main: nothing to release."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver=$(sed -n 's/^#define MyAppVersion "\(.*\)"$/\1/p' installer.iss)
          if [ -z "$ver" ]; then echo "no version in installer.iss"; exit 1; fi
          tag="v$ver"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists: nothing to release."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$ver" in
            *-dev.*)
              echo "$ver is a development version: never published (docs/VERSIONING.md)."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # The release criteria (docs/RELEASE_PROCESS.md). A version that fails
          # them stops here, red, with nothing built or published.
          python3 -m tools.release_check "$ver"
          echo "New version $ver: building and publishing $tag from $HEAD_SHA."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write  # gh release create/upload, only with a tag
    env:
      GH_TOKEN: ${{ github.token }}
      # The release the files go to: the new version's, the pushed tag, or the
      # one named by hand; empty for a dry build.
      RELEASE_TAG: ${{ needs.decide.outputs.tag }}
      # The tag does not exist yet: the release creates it on this commit.
      CREATE_TAG: ${{ needs.decide.outputs.create }}
      TARGET_SHA: ${{ needs.decide.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[psarc,desktop]" pyinstaller

      - name: Version
        id: version
        # The installer's version (tests/test_release_version.py keeps it equal to
        # pyproject's); a tag that disagrees would ship an installer that names
        # itself something else.
        run: |
          $iss = Select-String -Path installer.iss -Pattern '#define MyAppVersion "([^"]+)"'
          $ver = $iss.Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG.TrimStart('v') -ne $ver) {
            throw "tag $env:RELEASE_TAG does not match installer.iss version $ver"
          }

      - name: Bundle ffmpeg (LGPL build)
        # An LGPL build (BtbN/FFmpeg-Builds, release branch, static): RockForge
        # only decodes audio and measures loudness, which needs none of the GPL
        # parts. Its licence and where its source is go in with it (ffmpeg/),
        # which rockforge.spec bundles whole.
        run: |
          $names = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $pick = $names | Where-Object { $_ -match '^ffmpeg-n([\d.]+)-latest-win64-lgpl-[\d.]+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } | Select-Object -Last 1
          if (-not $pick) { throw "no LGPL win64 release-branch build found in BtbN/FFmpeg-Builds" }
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -D ffdl
          Expand-Archive "ffdl\$pick" -DestinationPath ffx
          $root = (Get-ChildItem ffx -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory ffmpeg -Force | Out-Null
          Copy-Item "$root\bin\ffmpeg.exe" ffmpeg\
          if (-not (Test-Path "$root\LICENSE.txt")) { throw "the ffmpeg build carries no LICENSE.txt" }
          Copy-Item "$root\LICENSE.txt" ffmpeg\LICENSE.txt
          $line = (& ffmpeg\ffmpeg.exe -version | Select-Object -First 1)
          if ($line -match 'enable-gpl') { throw "this ffmpeg is a GPL build" }
          $src = "https://github.com/FFmpeg/FFmpeg"
          if ($line -match '-g([0-9a-f]{7,})') { $src = "https://github.com/FFmpeg/FFmpeg/commit/$($Matches[1])" }
          @(
            "ffmpeg.exe bundled with RockForge",
            "",
            $line,
            "",
            "Licence: GNU LGPL 2.1 or later (see LICENSE.txt in this folder).",
            "Binary: $pick, from https://github.com/BtbN/FFmpeg-Builds (LGPL variant),",
            "  built by its published scripts, not modified by RockForge.",
            "Source code of this exact version: $src",
            "Build scripts: https://github.com/BtbN/FFmpeg-Builds"
          ) | Set-Content ffmpeg\SOURCE.txt -Encoding utf8
          Get-Content ffmpeg\SOURCE.txt

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        run: |
          python build_exe.py --zip --installer
          foreach ($f in "dist\rockforge\rockforge.exe", "dist\RockForge_portable.zip", "Output\RockForge_Setup.exe") {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }

      - name: Start the built app, make a project, install the extra components and use them
        # The components are what a user's first start installs (a private
        # Python 3.11 with the ML, lyrics, YouTube and PDF packages, and Deno),
        # so they are installed for real here and used through the frozen app:
        # librosa, PDF-to-GP5 and Demucs each have to answer.
        timeout-minutes: 75
        run: python .github/scripts/smoke_exe.py dist\rockforge\rockforge.exe --components

      - name: Name the downloads
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item Output\RockForge_Setup.exe "release\RockForge-$v-Setup.exe"
          Copy-Item dist\RockForge_portable.zip "release\RockForge-$v-portable.zip"
          Get-ChildItem release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RockForge-${{ steps.version.outputs.version }}-windows
          path: release/

      - name: Attach to the GitHub Release
        if: env.RELEASE_TAG != ''
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $opts = @("--title", "RockForge $($tag.TrimStart('v'))", "--notes-file", "docs/RELEASE_NOTES.md")
            # A new version's tag is made here, on the commit CI passed; a pushed tag must exist.
            if ($env:CREATE_TAG -eq 'true') { $opts += @("--target", $env:TARGET_SHA) } else { $opts += "--verify-tag" }
            if ($tag -match '-') { $opts += "--prerelease" }  # a beta is a pre-release
            gh release create $tag @opts
          }
          gh release upload $tag (Get-ChildItem release).FullName --clobber
